<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluprinter Seller API — Product & Blog</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
        body { margin: 0; padding: 0; }
        .topbar { display: none; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function () {
            const spec = {
                openapi: "3.0.3",
                info: {
                    title: "Bluprinter Seller API — Product & Blog",
                    version: "2.0.0",
                    description:
                        "API **Product** & **Blog** cho seller.\n\n" +
                        "## Auth\n" +
                        "Header `X-API-Token: bluprinter_...` (tại `/admin/api-token`).\n\n" +
                        "Token cần permission `seller` (hoặc `product:*` / `blog:*`) và **`default_shop_id`** = shop của seller.\n\n" +
                        "Chỉ một bộ endpoint: `/api/seller/products` và `/api/seller/blog`.",
                    contact: { name: "Bluprinter Support", url: "https://bluprinter.com" },
                },
                servers: [
                    { url: "http://localhost", description: "Laragon local" },
                    { url: "http://localhost:8000", description: "php artisan serve" },
                    { url: "https://bluprinter.com", description: "Production" },
                ],
                tags: [
                    { name: "Products", description: "CRUD sản phẩm trong shop của seller" },
                    { name: "Blog", description: "CRUD bài viết blog trong shop của seller" },
                ],
                security: [{ ApiToken: [] }],
                paths: {
                    "/api/seller/products": {
                        get: {
                            tags: ["Products"],
                            summary: "List products",
                            operationId: "sellerListProducts",
                            security: [{ ApiToken: [] }],
                            parameters: [
                                { name: "page", in: "query", schema: { type: "integer", default: 1 } },
                                { name: "per_page", in: "query", schema: { type: "integer", default: 20, maximum: 100 } },
                                { name: "status", in: "query", schema: { type: "string", enum: ["active", "inactive", "draft"] } },
                                { name: "search", in: "query", schema: { type: "string" }, description: "name / slug / sku" },
                            ],
                            responses: {
                                200: {
                                    description: "OK",
                                    content: {
                                        "application/json": {
                                            schema: { $ref: "#/components/schemas/ProductListResponse" },
                                        },
                                    },
                                },
                                401: { $ref: "#/components/responses/Unauthorized" },
                                403: { $ref: "#/components/responses/Forbidden" },
                            },
                        },
                        post: {
                            tags: ["Products"],
                            summary: "Create product",
                            description: "Tải `media_urls` → S3, clone variants từ template.",
                            operationId: "sellerCreateProduct",
                            security: [{ ApiToken: [] }],
                            requestBody: {
                                required: true,
                                content: {
                                    "application/json": {
                                        schema: { $ref: "#/components/schemas/ProductCreateRequest" },
                                        example: {
                                            name: "Austin Skyline Tee",
                                            template_id: 1,
                                            media_urls: [
                                                "https://picsum.photos/800/800?random=1",
                                                "https://picsum.photos/800/800?random=2",
                                            ],
                                            price: 18.95,
                                            list_price: 28.95,
                                            quantity: 999,
                                            status: "active",
                                            description: "AI-generated product",
                                        },
                                    },
                                },
                            },
                            responses: {
                                201: {
                                    description: "Created",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean", example: true },
                                                    message: { type: "string" },
                                                    product_id: { type: "integer" },
                                                    product_url: { type: "string", format: "uri" },
                                                    data: { $ref: "#/components/schemas/Product" },
                                                },
                                            },
                                        },
                                    },
                                },
                                401: { $ref: "#/components/responses/Unauthorized" },
                                403: { $ref: "#/components/responses/Forbidden" },
                                422: { $ref: "#/components/responses/ValidationError" },
                            },
                        },
                    },
                    "/api/seller/products/{id}": {
                        get: {
                            tags: ["Products"],
                            summary: "Get product",
                            operationId: "sellerGetProduct",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            responses: {
                                200: {
                                    description: "OK",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    data: { $ref: "#/components/schemas/ProductDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                            },
                        },
                        put: {
                            tags: ["Products"],
                            summary: "Update product",
                            operationId: "sellerUpdateProduct",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            requestBody: {
                                required: true,
                                content: {
                                    "application/json": {
                                        schema: { $ref: "#/components/schemas/ProductUpdateRequest" },
                                    },
                                },
                            },
                            responses: {
                                200: {
                                    description: "Updated",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    message: { type: "string" },
                                                    data: { $ref: "#/components/schemas/ProductDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                                422: { $ref: "#/components/responses/ValidationError" },
                            },
                        },
                        delete: {
                            tags: ["Products"],
                            summary: "Delete product",
                            operationId: "sellerDeleteProduct",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            responses: {
                                200: {
                                    description: "Deleted",
                                    content: {
                                        "application/json": {
                                            schema: { $ref: "#/components/schemas/SuccessMessage" },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                            },
                        },
                    },
                    "/api/seller/blog": {
                        get: {
                            tags: ["Blog"],
                            summary: "List blog posts",
                            operationId: "sellerListBlog",
                            security: [{ ApiToken: [] }],
                            parameters: [
                                { name: "page", in: "query", schema: { type: "integer", default: 1 } },
                                { name: "per_page", in: "query", schema: { type: "integer", default: 20, maximum: 100 } },
                                {
                                    name: "status",
                                    in: "query",
                                    schema: { type: "string", enum: ["published", "draft", "scheduled", "pending"] },
                                },
                                {
                                    name: "type",
                                    in: "query",
                                    schema: { type: "string", enum: ["article", "video", "gallery", "product_review"] },
                                },
                                { name: "post_category_id", in: "query", schema: { type: "integer" } },
                                { name: "search", in: "query", schema: { type: "string" } },
                            ],
                            responses: {
                                200: {
                                    description: "OK",
                                    content: {
                                        "application/json": {
                                            schema: { $ref: "#/components/schemas/BlogListResponse" },
                                        },
                                    },
                                },
                                401: { $ref: "#/components/responses/Unauthorized" },
                                403: { $ref: "#/components/responses/Forbidden" },
                            },
                        },
                        post: {
                            tags: ["Blog"],
                            summary: "Create blog post",
                            description:
                                "Tạo bài viết (posts). Ảnh: truyền URL — API tải về S3 khi được. Shop lấy từ `default_shop_id` trên token.",
                            operationId: "sellerCreateBlog",
                            security: [{ ApiToken: [] }],
                            requestBody: {
                                required: true,
                                content: {
                                    "application/json": {
                                        schema: { $ref: "#/components/schemas/BlogCreateRequest" },
                                        example: {
                                            title: "How to style a skyline tee",
                                            content: "<p>Full HTML content here...</p>",
                                            excerpt: "Short summary",
                                            type: "article",
                                            status: "published",
                                            featured_image_url: "https://picsum.photos/1200/630",
                                            post_category_id: 1,
                                            tags: [1, 2],
                                            featured: false,
                                            allow_comments: true,
                                            meta_title: "Skyline tee guide",
                                            meta_description: "Tips for styling",
                                        },
                                    },
                                },
                            },
                            responses: {
                                201: {
                                    description: "Created",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    message: { type: "string" },
                                                    post_id: { type: "integer" },
                                                    post_url: { type: "string", format: "uri" },
                                                    data: { $ref: "#/components/schemas/BlogPostDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                401: { $ref: "#/components/responses/Unauthorized" },
                                403: { $ref: "#/components/responses/Forbidden" },
                                422: { $ref: "#/components/responses/ValidationError" },
                            },
                        },
                    },
                    "/api/seller/blog/{id}": {
                        get: {
                            tags: ["Blog"],
                            summary: "Get blog post",
                            operationId: "sellerGetBlog",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            responses: {
                                200: {
                                    description: "OK",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    data: { $ref: "#/components/schemas/BlogPostDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                            },
                        },
                        put: {
                            tags: ["Blog"],
                            summary: "Update blog post",
                            operationId: "sellerUpdateBlog",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            requestBody: {
                                required: true,
                                content: {
                                    "application/json": {
                                        schema: { $ref: "#/components/schemas/BlogUpdateRequest" },
                                    },
                                },
                            },
                            responses: {
                                200: {
                                    description: "Updated",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    message: { type: "string" },
                                                    data: { $ref: "#/components/schemas/BlogPostDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                                422: { $ref: "#/components/responses/ValidationError" },
                            },
                        },
                        delete: {
                            tags: ["Blog"],
                            summary: "Delete blog post",
                            operationId: "sellerDeleteBlog",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            responses: {
                                200: {
                                    description: "Deleted",
                                    content: {
                                        "application/json": {
                                            schema: { $ref: "#/components/schemas/SuccessMessage" },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                            },
                        },
                    },
                    "/api/seller/blog/{id}/publish": {
                        post: {
                            tags: ["Blog"],
                            summary: "Publish blog post",
                            description: "Set status=published and published_at if missing.",
                            operationId: "sellerPublishBlog",
                            security: [{ ApiToken: [] }],
                            parameters: [{ $ref: "#/components/parameters/IdPath" }],
                            responses: {
                                200: {
                                    description: "Published",
                                    content: {
                                        "application/json": {
                                            schema: {
                                                type: "object",
                                                properties: {
                                                    success: { type: "boolean" },
                                                    message: { type: "string" },
                                                    data: { $ref: "#/components/schemas/BlogPostDetail" },
                                                },
                                            },
                                        },
                                    },
                                },
                                404: { $ref: "#/components/responses/NotFound" },
                            },
                        },
                    }
                },
                components: {
                    securitySchemes: {
                        ApiToken: {
                            type: "apiKey",
                            in: "header",
                            name: "X-API-Token",
                            description:
                                "Token dạng `bluprinter_...`. Permission `seller` + `default_shop_id`. Lấy tại `/admin/api-token`.",
                        },
                    },
                    parameters: {
                        IdPath: {
                            name: "id",
                            in: "path",
                            required: true,
                            schema: { type: "integer", example: 123 },
                        },
                    },
                    responses: {
                        Unauthorized: {
                            description: "Missing / invalid token",
                            content: {
                                "application/json": {
                                    schema: { $ref: "#/components/schemas/Error" },
                                    example: { success: false, message: "API token is required. Send header X-API-Token." },
                                },
                            },
                        },
                        Forbidden: {
                            description: "Token lacks permission",
                            content: {
                                "application/json": {
                                    schema: { $ref: "#/components/schemas/Error" },
                                    example: {
                                        success: false,
                                        message: "API token lacks permission: seller or blog:create",
                                    },
                                },
                            },
                        },
                        NotFound: {
                            description: "Resource not found",
                            content: {
                                "application/json": {
                                    schema: { $ref: "#/components/schemas/Error" },
                                    example: { success: false, message: "Product not found" },
                                },
                            },
                        },
                        ValidationError: {
                            description: "Validation failed",
                            content: {
                                "application/json": {
                                    schema: { $ref: "#/components/schemas/Error" },
                                },
                            },
                        },
                    },
                    schemas: {
                        SuccessMessage: {
                            type: "object",
                            properties: {
                                success: { type: "boolean", example: true },
                                message: { type: "string" },
                            },
                        },
                        Error: {
                            type: "object",
                            properties: {
                                success: { type: "boolean", example: false },
                                message: { type: "string" },
                                errors: {
                                    type: "object",
                                    additionalProperties: {
                                        type: "array",
                                        items: { type: "string" },
                                    },
                                },
                            },
                        },
                        Pagination: {
                            type: "object",
                            properties: {
                                current_page: { type: "integer", example: 1 },
                                last_page: { type: "integer", example: 5 },
                                per_page: { type: "integer", example: 20 },
                                total: { type: "integer", example: 100 },
                            },
                        },
                        Product: {
                            type: "object",
                            properties: {
                                id: { type: "integer" },
                                name: { type: "string" },
                                slug: { type: "string" },
                                description: { type: "string" },
                                price: { type: "number" },
                                list_price: { type: "number", nullable: true },
                                quantity: { type: "integer", nullable: true },
                                status: { type: "string", enum: ["active", "inactive", "draft"] },
                                template_id: { type: "integer" },
                                shop_id: { type: "integer" },
                                url: { type: "string", format: "uri" },
                                media: { type: "array", items: { type: "string", format: "uri" } },
                                created_by: { type: "string", nullable: true },
                                created_at: { type: "string", format: "date-time" },
                                updated_at: { type: "string", format: "date-time" },
                            },
                        },
                        ProductDetail: {
                            allOf: [
                                { $ref: "#/components/schemas/Product" },
                                {
                                    type: "object",
                                    properties: {
                                        shop: { type: "object", nullable: true },
                                        template: { type: "object", nullable: true },
                                        variants: { type: "array", items: { type: "object" } },
                                    },
                                },
                            ],
                        },
                        ProductListResponse: {
                            type: "object",
                            properties: {
                                success: { type: "boolean" },
                                data: { type: "array", items: { $ref: "#/components/schemas/Product" } },
                                pagination: { $ref: "#/components/schemas/Pagination" },
                            },
                        },
                        ProductCreateRequest: {
                            type: "object",
                            required: ["name", "template_id", "media_urls"],
                            properties: {
                                name: { type: "string", maxLength: 255 },
                                description: { type: "string" },
                                template_id: { type: "integer" },
                                media_urls: {
                                    type: "array",
                                    minItems: 1,
                                    items: { type: "string", format: "uri" },
                                },
                                price: { type: "number", minimum: 0 },
                                list_price: { type: "number", minimum: 0 },
                                quantity: { type: "integer", minimum: 0, default: 999 },
                                status: { type: "string", enum: ["active", "inactive", "draft"], default: "active" },
                            },
                        },
                        ProductUpdateRequest: {
                            type: "object",
                            properties: {
                                name: { type: "string", maxLength: 255 },
                                description: { type: "string", nullable: true },
                                price: { type: "number", minimum: 0 },
                                list_price: { type: "number", minimum: 0 },
                                quantity: { type: "integer", minimum: 0 },
                                status: { type: "string", enum: ["active", "inactive", "draft"] },
                                media_urls: {
                                    type: "array",
                                    minItems: 1,
                                    items: { type: "string", format: "uri" },
                                },
                            },
                        },
                        BlogPost: {
                            type: "object",
                            properties: {
                                id: { type: "integer" },
                                title: { type: "string" },
                                slug: { type: "string" },
                                excerpt: { type: "string", nullable: true },
                                status: { type: "string", enum: ["published", "draft", "scheduled", "pending"] },
                                type: { type: "string", enum: ["article", "video", "gallery", "product_review"] },
                                template: { type: "string" },
                                featured: { type: "boolean" },
                                featured_image: { type: "string", nullable: true },
                                post_category_id: { type: "integer", nullable: true },
                                shop_id: { type: "integer" },
                                user_id: { type: "integer" },
                                published_at: { type: "string", format: "date-time", nullable: true },
                                url: { type: "string", format: "uri" },
                                reading_time: { type: "integer" },
                                created_at: { type: "string", format: "date-time" },
                                updated_at: { type: "string", format: "date-time" },
                            },
                        },
                        BlogPostDetail: {
                            allOf: [
                                { $ref: "#/components/schemas/BlogPost" },
                                {
                                    type: "object",
                                    properties: {
                                        content: { type: "string" },
                                        gallery: { type: "array", items: { type: "string" }, nullable: true },
                                        meta_title: { type: "string", nullable: true },
                                        meta_description: { type: "string", nullable: true },
                                        meta_keywords: { type: "string", nullable: true },
                                        allow_comments: { type: "boolean" },
                                        category: { type: "object", nullable: true },
                                        tags: { type: "array", items: { type: "object" } },
                                        shop: { type: "object", nullable: true },
                                        user: { type: "object", nullable: true },
                                    },
                                },
                            ],
                        },
                        BlogListResponse: {
                            type: "object",
                            properties: {
                                success: { type: "boolean" },
                                data: { type: "array", items: { $ref: "#/components/schemas/BlogPost" } },
                                pagination: { $ref: "#/components/schemas/Pagination" },
                            },
                        },
                        BlogCreateRequest: {
                            type: "object",
                            required: ["title", "content", "type"],
                            properties: {
                                title: { type: "string", maxLength: 255 },
                                content: { type: "string", description: "HTML content" },
                                excerpt: { type: "string" },
                                featured_image_url: { type: "string", format: "uri" },
                                gallery_urls: { type: "array", items: { type: "string", format: "uri" } },
                                post_category_id: { type: "integer" },
                                tags: { type: "array", items: { type: "integer" } },
                                status: {
                                    type: "string",
                                    enum: ["published", "draft", "scheduled", "pending"],
                                    default: "published",
                                },
                                published_at: { type: "string", format: "date-time" },
                                type: { type: "string", enum: ["article", "video", "gallery", "product_review"] },
                                template: { type: "string", default: "default" },
                                featured: { type: "boolean", default: false },
                                allow_comments: { type: "boolean", default: true },
                                meta_title: { type: "string" },
                                meta_description: { type: "string" },
                                meta_keywords: { type: "string" },
                            },
                        },
                        BlogUpdateRequest: {
                            type: "object",
                            properties: {
                                title: { type: "string", maxLength: 255 },
                                content: { type: "string" },
                                excerpt: { type: "string" },
                                featured_image_url: { type: "string", format: "uri" },
                                gallery_urls: { type: "array", items: { type: "string", format: "uri" } },
                                post_category_id: { type: "integer", nullable: true },
                                tags: { type: "array", items: { type: "integer" } },
                                status: { type: "string", enum: ["published", "draft", "scheduled", "pending"] },
                                published_at: { type: "string", format: "date-time" },
                                type: { type: "string", enum: ["article", "video", "gallery", "product_review"] },
                                template: { type: "string" },
                                featured: { type: "boolean" },
                                allow_comments: { type: "boolean" },
                                meta_title: { type: "string" },
                                meta_description: { type: "string" },
                                meta_keywords: { type: "string" },
                            },
                        },
                    },
                },
            };

            SwaggerUIBundle({
                spec: spec,
                dom_id: "#swagger-ui",
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                plugins: [SwaggerUIBundle.plugins.DownloadUrl],
                layout: "StandaloneLayout",
                persistAuthorization: true,
            });
        };
    </script>
</body>
</html>
